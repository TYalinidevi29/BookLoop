<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – BookLoop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar container -->
  <header id="navbar"></header>

  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="form-card" style="width: 100%; max-width: 440px; margin: 0;">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.5rem;">🎉</span>
        <h1 style="font-size: 1.6rem; font-weight: 700; margin-top: 8px;">Create an Account</h1>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Join BookLoop to share and request books</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="e.g. Jane Doe"
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="At least 6 characters"
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary btn-block" style="margin-top: 22px;">
          Create Account
        </button>
      </form>

      <div class="form-footer-link">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 BookLoop – Book Sharing & Exchange Platform.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
