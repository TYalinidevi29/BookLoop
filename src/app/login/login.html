<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="logo-icon">
        📚
      </div>

      <h1>Welcome Back</h1>

      <p>
        Login to continue using BookLoop.
      </p>

    </div>

    <div class="input-group">

      <label>
        Email
      </label>

      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        [(ngModel)]="email"
      >

    </div>

    <div class="input-group">

      <label>
        Password
      </label>

      <input
        type="password"
        name="password"
        placeholder="Enter your password"
        [(ngModel)]="password"
      >

    </div>

    <button
      type="button"
      class="login-btn"
      (click)="login()"
    >
      Login
    </button>

    <p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </p>

  </div>

</div>
