<div class="books-page">

  <div class="books-header">

    <h1>Browse Books</h1>

    <p>
      Discover books shared by readers on BookLoop.
    </p>

    <input
      type="text"
      placeholder="Search books by title..."
      [(ngModel)]="searchText"
    >

  </div>


  <div class="book-list">

    <div
      class="book-card"
      *ngFor="let book of books"
    >

      <div class="book-icon">
        📖
      </div>

      <h3>
        {{ book.title }}
      </h3>

      <p>
        <strong>Author:</strong>
        {{ book.author }}
      </p>

      <p>
        <strong>Category:</strong>
        {{ book.category }}
      </p>

      <button
        type="button"
        (click)="requestBook(book)"
      >
        Request Book
      </button>

    </div>

  </div>


  <p
    class="no-books"
    *ngIf="books.length === 0"
  >
    No books found.
  </p>

</div>
